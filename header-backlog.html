<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Backlog Operativo Productivo — Header</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
  }
  .frame {
    height: 100%;
    width: 100%;
    background: #111111;
    padding: 10px;
    border-radius: 6px;
  }
  .banner {
    position: relative;
    height: 100%;
    width: 100%;
    background: #FFFFFF;
    overflow: hidden;
    border-radius: 3px;
  }

  /* ---- diagonal stripes ---- */
  .stripe {
    position: absolute;
    left: 0;
    right: 0;
    height: 20px;
    background: #C81E1E;
    z-index: 2;
    overflow: visible;
  }
  .stripe-top { top: 0; }
  .stripe-bottom { bottom: 0; }
  .stripe .wedge {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 42%;
    background: linear-gradient(115deg, #C81E1E 0%, #D9541D 30%, #EE8A1F 65%, #F7C02B 100%);
  }
  .stripe-top .wedge { clip-path: polygon(45% 0, 100% 0, 100% 100%, 0% 100%); }
  .stripe-bottom .wedge { clip-path: polygon(0% 0, 100% 0, 100% 100%, 45% 100%); }
  .stripe .wedge::after {
    content: '';
    position: absolute;
    left: -6%;
    right: 0;
    height: 5px;
    background: linear-gradient(90deg, #E8721C, #FBC02D);
  }
  .stripe-top .wedge::after {
    top: -5px;
    clip-path: polygon(48% 0, 100% 0, 100% 100%, 3% 100%);
  }
  .stripe-bottom .wedge::after {
    bottom: -5px;
    clip-path: polygon(3% 0, 100% 0, 100% 100%, 48% 100%);
  }

  /* ---- watermark ---- */
  .watermark {
    position: absolute;
    right: -40px;
    top: 50%;
    transform: translateY(-50%) scale(2.6) rotate(-6deg);
    width: 140px;
    height: 100px;
    opacity: 0.07;
    z-index: 1;
    pointer-events: none;
  }
  .watermark img { width: 100%; height: auto; display: block; }

  /* ---- content ---- */
  .content {
    position: relative;
    z-index: 3;
    height: 100%;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 18px 36px;
  }
  .logo-lockup {
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
  }
  .logo-lockup img.icon {
    height: 56px;
    width: auto;
  }
  .logo-lockup img.word {
    height: 26px;
    width: auto;
  }
  .divider {
    width: 1px;
    align-self: stretch;
    margin: 6px 0;
    background: #E3E3E3;
    flex-shrink: 0;
  }
  .text-block {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.15;
  }
  .text-block .title {
    color: #1A1A1A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: 0.3px;
    white-space: nowrap;
  }
  .text-block .subtitle {
    margin-top: 4px;
    color: #6B6B6B;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
  }
  .text-block .tag {
    display: table;
    align-self: flex-start;
    margin-top: 8px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.4px;
    text-transform: uppercase;
    color: #FFFFFF;
    background: #C81E1E;
    padding: 3px 10px;
    border-radius: 999px;
  }
</style>
</head>
