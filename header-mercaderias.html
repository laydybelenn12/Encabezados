<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Proyecto Mercaderías — Header</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: transparent;
  }
  .header-bar {
    height: 100%;
    width: 100%;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 24px;
    padding: 14px 32px;
    background: linear-gradient(135deg, #1F2937 0%, #111827 100%);
    border-radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    border-left: 6px solid #E1251B;
  }
  .header-bar img {
    height: 64px;
    width: auto;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.35));
  }
  .header-text {
    display: flex;
    flex-direction: column;
    justify-content: center;
    line-height: 1.15;
  }
  .header-text .brand {
    color: #9CA3AF;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-text .title {
    color: #FFFFFF;
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }
  .header-text .tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: #FFFFFF;
    background: #E1251B;
    padding: 3px 10px;
    border-radius: 999px;
    width: fit-content;
  }
</style>
